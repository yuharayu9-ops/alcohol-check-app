<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アルコールチェック報告</title>
    <style>
        body { font-family: sans-serif; background-color: #eef9ff; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0077b6; border-bottom: 3px solid #caf0f8; padding-bottom: 10px; }
        .section-title { font-weight: bold; margin: 20px 0 10px; color: #023e8a; border-left: 8px solid #00b4d8; padding-left: 12px; }
        .btn-group { display: grid; gap: 8px; margin-bottom: 10px; grid-template-columns: 1fr 1fr; }
        .select-btn { padding: 18px 10px; border: 3px solid #e0e0e0; border-radius: 15px; background: #fff; cursor: pointer; font-size: 1.1em; font-weight: bold; text-align: center; color: #444; }
        .select-btn.active { background: #0077b6; color: white; border-color: #023e8a; }
        #alcohol-alert { display: none; background-color: #ff0000; color: white; padding: 15px; border-radius: 12px; margin-top: 10px; font-weight: bold; text-align: center; border: 3px solid #b30000; }
        textarea { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .submit-btn { width: 100%; padding: 22px; background: #023e8a; color: white; border: none; border-radius: 60px; font-size: 1.5em; font-weight: bold; margin-top: 30px; }

        /* 特大指示ポップアップ（モーダル）のスタイル */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;
        }
        .modal-box {
            background: #fff; width: 100%; max-width: 500px; border-radius: 20px; padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); text-align: center; border: 4px solid #0077b6;
        }
        .modal-title { font-size: 1.5em; font-weight: bold; color: #d90429; margin-bottom: 15px; }
        .modal-body { font-size: 1.2em; font-weight: bold; color: #2b2d42; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 2px dashed #0077b6; margin-bottom: 20px; }
        .modal-btn { width: 100%; padding: 18px; background: #38b000; color: white; border: none; border-radius: 40px; font-size: 1.3em; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- 安全指示 特大ポップアップ -->
<div id="instruction-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title">📢 本日の安全運転指示</div>
        <div id="modal-instruction-text" class="modal-body">読み込み中...</div>
        <button class="modal-btn" onclick="closeInstructionModal()">指示を確認しました</button>
    </div>
</div>

<div class="container">
    <h2>🚚 点呼報告</h2>
    
    <div class="section-title">⏰ 朝・夕</div>
    <div class="btn-group">
        <div class="select-btn" onclick="sel('check_type','朝',this)">朝</div>
        <div class="select-btn" onclick="sel('check_type','夕',this)">夕</div>
    </div>
    
    <div class="section-title">👤 名前</div>
    <div id="driver-buttons" class="btn-group"></div>
    
    <div class="section-title">🚗 車両（未選択なら未定）</div>
    <div id="car-buttons" class="btn-group" style="grid-template-columns: 1fr;"></div>
    
    <div class="section-title">📱 検知器</div>
    <div class="btn-group">
        <div class="select-btn" onclick="sel('use_device','使用',this)">使用</div>
        <div class="select-btn" onclick="sel('use_device','未使用',this)">未使用</div>
    </div>
    
    <div class="section-title">🍷 酒気帯び</div>
    <div class="btn-group">
        <div class="select-btn" onclick="selAlc('無',this)">無</div>
        <div class="select-btn danger" onclick="selAlc('有',this)">有</div>
    </div>
    <div id="alcohol-alert">🚨 異常検知！アルコールが検出されました。直ちに運行管理者に報告し、指示を仰いでください。</div>

    <div class="section-title">📢 今日の指示事項</div>
    <div id="instruction-buttons" class="btn-group" style="grid-template-columns: 1fr;"></div>

    <div class="section-title">👮 確認者</div>
    <div id="checker-buttons" class="btn-group"></div>
    
    <div class="section-title">📝 備考</div>
    <textarea id="instruction" rows="3" placeholder="備考があれば記入"></textarea>
    
    <button class="submit-btn" onclick="sub()">報告を送信！</button>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxFY0EO8EYskrjylMr3m4xofJ2UVZO6k-U_XihN1-AZFXtWoQ0l0TGuCTGn-gIoCVs_3Q/exec";
    
    const INSTRUCTION_LIST = [
        "【車間距離】本日は天候に注意し、前車との車間距離を十分にとった上で走行してください。",
        "【一時停止】交差点や見通しの悪い場所では『止まれ』でタイヤを確実に停止させてください。",
        "【後退注意】駐車場や狭い場所での後退時は、必ず降車して後方目視確認を行ってください。",
        "【ながら運転禁止】走行中のスマホ操作・注視は絶対厳禁です。停車して操作してください。",
        "【体調管理】無理な運転は厳禁です。少しでも眠気や体調不良を感じたら休息を取ってください。"
    ];

    // ★ 開くたびにランダムで指示を選択する処理
    const randomIndex = Math.floor(Math.random() * INSTRUCTION_LIST.length);
    let selectedInstruction = INSTRUCTION_LIST[randomIndex];

    let formData = { 
        check_type:"", 
        driver_name:"", 
        car_number:"未定", 
        method:"対面", 
        use_device:"", 
        has_alcohol:"", 
        checker_name:"",
        safety_instruction: selectedInstruction
    };

    window.onload = async () => {
        // 指示事項ボタンの生成（ランダム選定されたものに最初から選択マークがつきます）
        const insGroup = document.getElementById('instruction-buttons');
        INSTRUCTION_LIST.forEach((text) => {
            const b = document.createElement('div');
            b.className = 'select-btn' + (text === selectedInstruction ? ' active' : '');
            b.style.fontSize = '0.9em';
            b.style.textAlign = 'left';
            b.innerText = text;
            b.onclick = () => {
                selectedInstruction = text;
                formData.safety_instruction = text;
                insGroup.querySelectorAll('.select-btn').forEach(btn => btn.classList.remove('active'));
                b.classList.add('active');
            };
            insGroup.appendChild(b);
        });

        try {
            const res = await fetch(GAS_URL); 
            const d = await res.json();
            const create = (list, gid, key) => {
                const g = document.getElementById(gid);
                list.forEach((v) => {
                    const b = document.createElement('div'); 
                    b.className = 'select-btn'; 
                    b.innerText = v;
                    b.onclick = () => sel(key, v, b); 
                    g.appendChild(b);
                });
            };
            create(d.drivers, 'driver-buttons', 'driver_name'); 
            create(d.cars, 'car-buttons', 'car_number'); 
            create(d.checkers, 'checker-buttons', 'checker_name');
        } catch(e) {
            console.error("データの読み込みに失敗しました", e);
        }
    };

    function showInstructionModal(text) {
        document.getElementById('modal-instruction-text').innerText = text;
        document.getElementById('instruction-modal').style.display = 'flex';
    }

    function closeInstructionModal() {
        document.getElementById('instruction-modal').style.display = 'none';
    }

    function sel(k, v, e) { 
        formData[k] = v; 
        e.parentElement.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active')); 
        e.classList.add('active'); 
    }

    function selAlc(v, e) {
        formData.has_alcohol = v;
        e.parentElement.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
        e.classList.add('active');
        
        const alertBox = document.getElementById('alcohol-alert');
        alertBox.style.display = (v === '有') ? 'block' : 'none';

        // 酒気帯びを自らタップした直後にランダム選出された特大ポップアップを起動
        showInstructionModal(selectedInstruction);
    }

    async function sub() {
        let missing = [];
        if (!formData.check_type) missing.push("・朝・夕");
        if (!formData.driver_name) missing.push("・名前");
        if (!formData.use_device) missing.push("・検知器");
        if (!formData.has_alcohol) missing.push("・酒気帯び（無・有）");
        if (!formData.checker_name) missing.push("・確認者");

        if (missing.length > 0) {
            alert("以下の項目を選択してください：\n\n" + missing.join("\n"));
            return;
        }

        const b = document.querySelector('.submit-btn'); 
        b.disabled = true; 
        b.innerText = "送信中...";
        
        const userRemark = document.getElementById('instruction').value;
        formData.instruction = `【確認指示】${formData.safety_instruction}` + (userRemark ? ` / 【備考】${userRemark}` : '');

        await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(formData) });
        alert("送信完了！指示事項を確認して送信しました。"); 
        location.reload();
    }
</script>
</body>
</html>
